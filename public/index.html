<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7fb"><title>Авитолог</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#252a35;background:#f6f7fb}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{border:0;background:none;cursor:pointer;color:inherit}header{position:sticky;top:0;background:#fff;border-bottom:1px solid #e9ebf1;z-index:3}.top{height:60px;max-width:1100px;margin:auto;padding:0 22px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:9px;font-weight:700}.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(145deg,#7259ec,#8b72fa);display:grid;place-items:center;color:white;font-weight:800}nav{max-width:1100px;margin:auto;padding:0 22px;display:flex;overflow:auto}nav button{white-space:nowrap;padding:13px 15px;color:#7d8290;border-bottom:2px solid transparent;font-size:13px}nav button.active{color:#634fe1;border-color:#7259ec;font-weight:650}main{max-width:900px;margin:32px auto;padding:0 22px 100px}.eyebrow{color:#8c8fa0;letter-spacing:1.4px;font-weight:700;font-size:10px}.heading h1{font-size:30px;letter-spacing:-.7px;margin:5px 0 20px}.list{display:grid;gap:14px}.card{background:white;border:1px solid #e9ebf1;border-radius:17px;overflow:hidden;box-shadow:0 3px 14px #26314508}.body{padding:19px 22px}.row{display:flex;align-items:center;justify-content:space-between}.muted,.row small{color:#969aa7;font-size:11px}.pill{background:#f1efff;color:#6956db;padding:5px 9px;border-radius:20px;font-size:11px}.body h2{font-size:18px;margin:13px 0 8px}.body p{color:#6f7583;font-size:14px;line-height:1.55;white-space:pre-wrap}.gallery{height:245px;background:#f0f1f5;position:relative;display:grid;place-items:center}.gallery img{width:100%;height:100%;object-fit:contain}.gallery div{position:absolute;bottom:10px;background:#171922bb;color:white;border-radius:20px;padding:5px 12px}.gallery button{color:white;font-size:18px;margin:0 8px}.prices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.prices label{border:1px solid #e8e9ef;border-radius:12px;padding:10px;display:grid;grid-template-columns:16px 1fr;gap:4px}.prices input{grid-row:span 2;accent-color:#7159ea}.prices small{color:#7c8290;font-size:11px}.prices b{font-size:13px}.primary{background:#7058e8!important;color:white!important;border-radius:10px;padding:11px 15px;font-weight:650}.actions{display:flex;gap:8px;margin-top:14px}.actions button,.slot button,.offer button{padding:9px 12px;background:#f4f4f8;border-radius:9px;font-size:12px}.link{width:100%;text-align:left;padding:12px 0;border-top:1px solid #eee}.stats{font-size:13px;color:#747a88;margin:14px 0}.empty{text-align:center;padding:75px 10px;color:#7760eb}.empty h3{font-size:17px;color:#343947}.empty p{font-size:13px;color:#828795}.fab{position:fixed;right:max(22px,calc((100vw - 900px)/2));bottom:25px;background:#7058e8;color:white;border-radius:30px;padding:15px 19px;box-shadow:0 9px 24px #7058e859;font-weight:700}.lock{min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 30%,#efedff,#f7f8fc 60%)}.lock form{width:min(100%,370px);background:white;padding:34px;border:1px solid #ececf3;border-radius:22px;box-shadow:0 16px 55px #22263b12;display:grid;gap:14px;text-align:center}.lock .logo{margin:auto;width:42px;height:42px;font-size:22px}.lock h1{margin:0;font-size:25px}.lock p{color:#858998;font-size:13px;margin:0}.lock input,.dialog input:not([type=file]),.dialog textarea,.calendar input{width:100%;padding:11px 12px;border:1px solid #e1e3ea;border-radius:10px}.error{color:#b54040}.overlay{position:fixed;inset:0;background:#15162575;z-index:8;display:grid;place-items:center;padding:17px}.dialog{position:relative;background:#fff;border-radius:20px;padding:25px;width:min(100%,500px);max-height:92dvh;overflow:auto;display:grid;gap:14px}.dialog h2{margin:0}.dialog .close{position:absolute;right:15px;top:10px;font-size:25px}.dialog label,.calendar label{display:grid;gap:7px;font-size:12px;font-weight:600;color:#555b69}.drop{position:relative;min-height:100px;border:1px dashed #d8d4f4;border-radius:13px;display:grid!important;place-items:center;color:#7259e7!important}.drop input{position:absolute;inset:0;opacity:0}.calendar{display:grid;grid-template-columns:1fr 1fr;gap:14px}.calendar form{display:grid;gap:12px}.slot{padding:12px 0;border-top:1px solid #eee;font-size:13px}.hint{background:#f3f1ff;padding:12px;border-radius:10px;color:#6e5add!important;font-size:12px!important}@media(max-width:640px){.top{padding:0 15px}nav{padding:0 8px}nav button{padding:12px 10px;font-size:12px}main{margin:23px auto;padding:0 14px 100px}.heading h1{font-size:26px}.body{padding:15px}.gallery{height:205px}.prices{gap:5px}.prices label{padding:8px 5px;grid-template-columns:14px 1fr}.prices b{font-size:11px}.prices small{font-size:10px}.calendar{grid-template-columns:1fr}.fab{right:16px;bottom:18px}}
</style></head><body><div id="app"></div><script>
const $=s=>document.querySelector(s),money=n=>n?new Intl.NumberFormat('ru-RU').format(n)+' ₽':'—';let state={auth:false,tab:'queue',items:[],slots:[],bookings:[],expanded:{},files:[]};
async function api(url,opt={}){let r=await fetch('/api'+url,{credentials:'same-origin',...opt});if(r.status===401){state.auth=false;render();return null}let d=await r.json();if(!r.ok)throw Error(d.error||'Ошибка');return d}
async function refresh(){try{let[a,b,c]=await Promise.all([api('/items'),api('/slots'),api('/bookings')]);if(a)state.items=a;if(b)state.slots=b;if(c)state.bookings=c;render()}catch(e){alert(e.message)}}
function render(){if(!state.auth){$('#app').innerHTML='<main class="lock"><form id="login"><div class="logo">А</div><h1>Авитолог</h1><p>Панель управления продажами</p><input type="password" name="password" placeholder="Пароль" autofocus><button class="primary">Войти</button><small class="muted">Локальный доступ · защищённая сессия</small></form></main>';$('#login').onsubmit=async e=>{e.preventDefault();try{await api('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:new FormData(e.target).get('password')})});state.auth=true;refresh()}catch{alert('Неверный пароль')}};return}
const labels={queue:'Объявления',ready:'Готовые',published:'Опубликованные',calendar:'Календарь'},filtered=state.items.filter(x=>state.tab==='queue'?['draft_queue','processing'].includes(x.status):state.tab==='ready'?x.status==='ready_to_publish':x.status==='published');
let body=state.tab==='calendar'?'<div class="calendar"><section class="card body"><h2>Слоты самовывоза</h2><form id="slot"><label>Дата<input required name="date" type="date"></label><label>С<input required name="time_from" type="time" value="14:00"></label><label>До<input required name="time_to" type="time" value="18:00"></label><button class="primary">Добавить слот</button></form>'+state.slots.map(s=>'<div class="slot">'+s.date+' · '+s.time_from+'–'+s.time_to+' <button data-del="'+s.id+'">×</button></div>').join('')+'<p class="hint">ИИ может предложить только окна, открытые продавцом.</p></section><section class="card body"><h2>Встречи</h2>'+(state.bookings.length?state.bookings.map(b=>'<p>'+ (b.title||'Товар')+' · '+(b.buyer_name||'Покупатель')+' · '+(b.meeting_time||b.time_from||'')+'</p>').join(''):'<p class="muted">Подтверждённых встреч пока нет.</p>')+'</section></div>':'<section class="list">'+filtered.map(x=>'<article class="card">'+(x.photos?.length?'<div class="gallery"><img src="'+x.photos[0].file_path+'"></div>':'')+'<div class="body"><div class="row"><span class="pill">'+({draft_queue:'В очереди',processing:'Обрабатывается',ready_to_publish:'Готово к проверке',published:'Активно'})[x.status]+'</span></div><h2>'+esc(x.title||'Новый товар')+'</h2><p>'+esc(x.raw_text||'')+'</p>'+(x.status==='ready_to_publish'?'<div class="prices">'+[['Быстрая',x.price_fast],['Оптимальная',x.price_optimal],['Долгая',x.price_slow]].map(([n,v])=>'<label><input type="radio" name="p'+x.id+'" '+(x.selected_price===v?'checked':'')+' data-price="'+x.id+'|'+v+'"><small>'+n+'</small><b>'+money(v)+'</b></label>').join('')+'</div><button class="link" data-open="'+x.id+'">Показать описание　＋</button>'+(state.expanded[x.id]?'<p>'+esc(x.generated_description||'')+'</p>':'')+'<div class="actions"><button data-edit="'+x.id+'">Редактировать</button><button class="primary" data-publish="'+x.id+'">Опубликовать</button></div>':'')+(x.status==='published'?'<h2>'+money(x.selected_price)+'</h2><div class="stats">👁 '+x.views_count+'　♥ '+x.favorites_count+'　💬 '+x.contacts_count+'</div><button class="link" data-open="'+x.id+'">Торги и описание　＋</button>'+(state.expanded[x.id]?'<p>'+esc(x.generated_description||'')+'</p><p class="muted">Для офферов подключите Avito MCP.</p>':''):'')+'</div></article>').join('')+(filtered.length?'':'<div class="empty">✳<h3>Здесь пока пусто</h3><p>Добавьте товар, чтобы начать работу</p></div>')+'</section>';
$('#app').innerHTML='<header><div class="top"><div class="brand"><span class="logo">А</span> Авитолог</div><button id="logout">Выйти ↗</button></div><nav>'+Object.entries(labels).map(([k,v])=>'<button data-tab="'+k+'" class="'+(state.tab===k?'active':'')+'">'+v+'</button>').join('')+'</nav></header><main><div class="heading"><div class="eyebrow">ПАНЕЛЬ ПРОДАВЦА</div><h1>'+labels[state.tab]+'</h1></div>'+body+'</main>'+(state.tab==='queue'?'<button class="fab" id="new">＋ Добавить</button>':'');
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});$('#logout').onclick=async()=>{await api('/logout',{method:'POST'});state.auth=false;render()};if($('#new'))$('#new').onclick=modal;
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{state.expanded[b.dataset.open]=!state.expanded[b.dataset.open];render()});document.querySelectorAll('[data-price]').forEach(b=>b.onchange=()=>{let[id,p]=b.dataset.price.split('|');api('/items/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({selected_price:Number(p)})})});document.querySelectorAll('[data-publish]').forEach(b=>b.onclick=async()=>{await api('/items/'+b.dataset.publish+'/publish',{method:'POST'});refresh()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{let x=state.items.find(i=>i.id==b.dataset.edit),title=prompt('Заголовок',x.title);if(title!==null)api('/items/'+x.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({title})}).then(refresh)});
if($('#slot'))$('#slot').onsubmit=async e=>{e.preventDefault();await api('/slots',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});refresh()};document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{await api('/slots/'+b.dataset.del,{method:'DELETE'});refresh()})}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function modal(){let d=document.createElement('div');d.className='overlay';d.innerHTML='<form class="dialog" id="add"><button type="button" class="close">×</button><small class="eyebrow">НОВАЯ ПОЗИЦИЯ</small><h2>Добавить товар</h2><label class="drop">＋ Фотографии товара<input type="file" accept="image/*" capture="environment" multiple name="photos"><small>Можно выбрать несколько или сделать фото</small></label><label>Заметки<textarea required rows="5" name="raw_text" placeholder="Размеры, состояние, дефекты, комплект…"></textarea></label><label>Желаемая цена, ₽<input type="number" min="0" name="desired_price"></label><button class="primary">Сохранить в очередь</button></form>';document.body.append(d);d.querySelector('.close').onclick=()=>d.remove();d.onclick=e=>{if(e.target===d)d.remove()};d.querySelector('#add').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{await api('/items',{method:'POST',body:f});d.remove();refresh()}catch(e){alert(e.message)}}}
api('/session').then(x=>{state.auth=!!x?.authenticated;render();if(state.auth){refresh();setInterval(refresh,4000)}})
</script></body></html>
