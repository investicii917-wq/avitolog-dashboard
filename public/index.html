<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb">
<title>Авитолог</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#242936;background:#f6f7fb}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{border:0;background:none;cursor:pointer;color:inherit}header{position:sticky;top:0;z-index:4;background:#fff;border-bottom:1px solid #e9ebf1}.top,nav,main{max-width:980px;margin:auto}.top{height:64px;padding:0 24px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:750}.logo{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,#684ee4,#967df5);color:white;font-weight:850}.top button{border-radius:10px;background:#f4f4f8;padding:9px 12px;font-size:13px;color:#6e7380}nav{padding:0 18px;display:flex;gap:2px;overflow:auto}nav button{padding:13px 15px;border-bottom:2px solid transparent;white-space:nowrap;font-size:13px;color:#7b8190}nav button.active{border-color:#7058e8;color:#654fe0;font-weight:700}main{padding:34px 24px 110px}.eyebrow{font-size:10px;letter-spacing:1.4px;font-weight:750;color:#8c91a0}.heading{display:flex;align-items:end;justify-content:space-between;margin-bottom:20px}.heading h1{font-size:30px;letter-spacing:-.8px;margin:5px 0 0}.tag{font-size:11px;background:#eaf8f1;color:#29865d;padding:5px 8px;border-radius:20px}.list{display:grid;gap:14px}.card{background:white;border:1px solid #e7e9f0;border-radius:18px;overflow:hidden;box-shadow:0 4px 18px #202a4108}.body{padding:20px 22px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{padding:5px 9px;border-radius:20px;background:#f1efff;color:#6854d8;font-size:11px}.pill.live{background:#eaf8f1;color:#29865d}.pill.wait{background:#fff3df;color:#bd7b15}.date,.muted{font-size:12px;color:#969ba8}.card h2{font-size:18px;margin:14px 0 8px}.card p{color:#6e7483;font-size:14px;line-height:1.55;white-space:pre-wrap}.prices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:17px 0}.prices label{border:1px solid #e6e8ef;border-radius:12px;padding:10px;display:grid;grid-template-columns:15px 1fr;gap:4px;cursor:pointer}.prices input{grid-row:span 2;accent-color:#7058e8}.prices small{font-size:11px;color:#818695}.prices b{font-size:13px}.actions{display:flex;gap:8px;margin-top:16px}.actions button{padding:10px 13px;border-radius:10px;background:#f4f4f8;font-size:12px;font-weight:650}.primary{background:#7058e8!important;color:#fff!important}.stats{display:flex;gap:17px;color:#727887;font-size:13px;margin:15px 0}.fab{position:fixed;right:max(22px,calc((100vw - 980px)/2));bottom:25px;border-radius:30px;background:#7058e8;color:white;padding:15px 20px;font-weight:700;box-shadow:0 9px 24px #7058e859}.empty{text-align:center;padding:70px 0;color:#7379e4}.empty h3{color:#343947;font-size:17px}.empty p{font-size:13px}.calendar{display:grid;grid-template-columns:1fr 1fr;gap:14px}.calendar form{display:grid;gap:12px}.calendar label,.dialog label{display:grid;gap:7px;font-size:12px;font-weight:650;color:#585e6c}.calendar input,.dialog input,.dialog textarea{width:100%;border:1px solid #e1e4ec;border-radius:10px;padding:11px 12px;background:white}.slot{border-top:1px solid #eceef3;padding:12px 0;font-size:13px}.slot button{float:right;color:#858a98;font-size:18px}.hint{background:#f1efff!important;color:#6854d8!important;border-radius:11px;padding:12px;font-size:12px!important}.lock{min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 25%,#efedff,#f7f8fc 63%)}.lock form{width:min(100%,370px);padding:34px;background:white;border:1px solid #e8e9f0;border-radius:22px;box-shadow:0 18px 60px #21263a12;display:grid;gap:14px;text-align:center}.lock .logo{width:44px;height:44px;margin:auto;font-size:22px}.lock h1{margin:0;font-size:26px}.lock p{margin:0;color:#858a98;font-size:13px}.lock input{padding:12px;border-radius:10px;border:1px solid #dfe2ea}.error{color:#bc3e42;font-size:12px}.overlay{position:fixed;inset:0;z-index:10;padding:18px;display:grid;place-items:center;background:#15162578}.dialog{position:relative;width:min(100%,510px);background:#fff;border-radius:20px;padding:25px;display:grid;gap:15px}.dialog h2{margin:0}.close{position:absolute;right:14px;top:9px;font-size:25px;color:#8b909c}.drop{min-height:98px;border:1px dashed #d9d4f4;border-radius:13px;display:grid!important;place-items:center;color:#7058e8!important;position:relative}.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}.drop small{font-weight:400;color:#9298a5}@media(max-width:640px){.top{padding:0 15px}nav{padding:0 8px}nav button{padding:12px 10px;font-size:12px}main{padding:25px 14px 105px}.heading h1{font-size:26px}.body{padding:16px}.prices{gap:5px}.prices label{padding:8px 5px;grid-template-columns:14px 1fr}.prices b{font-size:11px}.prices small{font-size:10px}.calendar{grid-template-columns:1fr}.fab{right:16px;bottom:18px}}
</style>
</head>
<body><div id="app"></div>
<script>
const app=document.getElementById('app');
const money=n=>new Intl.NumberFormat('ru-RU').format(n)+' ₽';
const state={locked:true,tab:'queue',items:[{id:1,status:'draft_queue',title:'Колёса R16',raw:'Комплект колёс, состояние хорошее. Есть небольшие следы эксплуатации.',price:12000},{id:2,status:'ready_to_publish',title:'Винтажный торшер',raw:'Металл, рабочий, патина на основании.',description:'Винтажный торшер с выразительной патиной. Рабочий, подойдёт для гостиной, кабинета или студии. Самовывоз по предварительному согласованию.',fast:5100,opt:6000,slow:6900,price:6000},{id:3,status:'published',title:'Набор инструментов СССР',raw:'Полный комплект, чистый, в металлическом кейсе.',description:'Аккуратный набор инструментов в металлическом кейсе.',price:3800,views:47,favorites:6,contacts:2}],slots:[]};
function escapeHtml(v){return String(v||'').replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]))}
function render(){
 if(state.locked){app.innerHTML='<main class="lock"><form id="login"><span class="logo">А</span><h1>Авитолог</h1><p>Панель управления продажами</p><input name="pass" type="password" placeholder="Пароль" autofocus><button class="primary">Войти</button><small class="muted">Визуальный прототип · данные не отправляются</small></form></main>';document.getElementById('login').onsubmit=e=>{e.preventDefault();if(new FormData(e.target).get('pass')==='132213'){state.locked=false;render()}else{const m=document.createElement('small');m.className='error';m.textContent='Неверный пароль';e.target.append(m)}};return}
 const names={queue:'Объявления',ready:'Готовые',published:'Опубликованные',calendar:'Календарь'};
 let content=state.tab==='calendar'?calendarHtml():cardsHtml();
 app.innerHTML='<header><div class="top"><div class="brand"><span class="logo">А</span>Авитолог</div><button id="exit">Выйти</button></div><nav>'+Object.entries(names).map(x=>'<button data-tab="'+x[0]+'" class="'+(state.tab===x[0]?'active':'')+'">'+x[1]+'</button>').join('')+'</nav></header><main><div class="heading"><div><div class="eyebrow">ПАНЕЛЬ ПРОДАВЦА</div><h1>'+names[state.tab]+'</h1></div><span class="tag">Автономный режим</span></div>'+content+'</main>'+(state.tab==='queue'?'<button class="fab" id="add">＋ Добавить</button>':'');
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});document.getElementById('exit').onclick=()=>{state.locked=true;render()};if(document.getElementById('add'))document.getElementById('add').onclick=dialog;
 document.querySelectorAll('[data-publish]').forEach(b=>b.onclick=()=>{let x=state.items.find(i=>i.id==b.dataset.publish);x.status='published';x.views=0;x.favorites=0;x.contacts=0;state.tab='published';render()});
 document.querySelectorAll('[data-price]').forEach(b=>b.onchange=()=>{let[x,p]=b.dataset.price.split('|');state.items.find(i=>i.id==x).price=Number(p)});
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{state.slots=state.slots.filter(s=>s.id!=b.dataset.del);render()});
 if(document.getElementById('slotform'))document.getElementById('slotform').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));state.slots.push({id:Date.now(),date:d.date,from:d.from,to:d.to});render()};
}
function cardsHtml(){let list=state.items.filter(x=>state.tab==='queue'?x.status==='draft_queue':x.status===state.tab);return '<section class="list">'+list.map(x=>'<article class="card"><div class="body"><div class="row"><span class="pill '+(x.status==='published'?'live':x.status==='draft_queue'?'wait':'')+'">'+(x.status==='draft_queue'?'В очереди':x.status==='ready_to_publish'?'Готово к проверке':'Активно')+'</span><span class="date">Сегодня</span></div><h2>'+escapeHtml(x.title)+'</h2><p>'+escapeHtml(x.raw)+'</p>'+(x.status==='ready_to_publish'?'<div class="prices">'+[['Быстрая',x.fast],['Оптимальная',x.opt],['Долгая',x.slow]].map(p=>'<label><input data-price="'+x.id+'|'+p[1]+'" name="p'+x.id+'" type="radio" '+(x.price===p[1]?'checked':'')+'><small>'+p[0]+'</small><b>'+money(p[1])+'</b></label>').join('')+'</div><p>'+escapeHtml(x.description)+'</p><div class="actions"><button>Редактировать</button><button class="primary" data-publish="'+x.id+'">Опубликовать</button></div>':'')+(x.status==='published'?'<h2>'+money(x.price)+'</h2><div class="stats"><span>👁 '+x.views+'</span><span>♥ '+x.favorites+'</span><span>💬 '+x.contacts+'</span></div><button class="link">Торги и описание</button>':'')+'</div></article>').join('')+(list.length?'':'<div class="empty">✳<h3>Здесь пока пусто</h3><p>Добавьте товар, чтобы начать работу</p></div>')+'</section>'}
function calendarHtml(){return '<div class="calendar"><section class="card body"><h2>Открыть время для самовывоза</h2><form id="slotform"><label>Дата<input required type="date" name="date"></label><label>С<input required type="time" name="from" value="14:00"></label><label>До<input required type="time" name="to" value="18:00"></label><button class="primary">Добавить слот</button></form><h3>Доступные слоты</h3>'+state.slots.map(s=>'<div class="slot">'+s.date+' · '+s.from+'–'+s.to+'<button data-del="'+s.id+'">×</button></div>').join('')+(state.slots.length?'':'<p class="muted">Вы пока не открыли время для встреч.</p>')+'</section><section class="card body"><h2>Встречи</h2><p class="muted">Подтверждённых встреч пока нет.</p><p class="hint">ИИ не назначает встречу сам. В этом прототипе список слотов существует только в вашем браузере.</p></section></div>'}
function dialog(){let d=document.createElement('div');d.className='overlay';d.innerHTML='<form class="dialog" id="newitem"><button type="button" class="close">×</button><div class="eyebrow">НОВАЯ ПОЗИЦИЯ</div><h2>Добавить товар</h2><label class="drop">＋ Фотографии товара<input type="file" accept="image/*" multiple><small>Фото остаются только в этом браузере</small></label><label>Заметки<textarea required rows="5" name="text" placeholder="Размеры, состояние, дефекты, комплект…"></textarea></label><label>Желаемая цена, ₽<input type="number" min="0" name="price"></label><button class="primary">Сохранить в очередь</button></form>';document.body.append(d);d.querySelector('.close').onclick=()=>d.remove();d.onclick=e=>{if(e.target===d)d.remove()};d.querySelector('#newitem').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),text=f.get('text'),price=Number(f.get('price'))||0;state.items.unshift({id:Date.now(),status:'draft_queue',title:text.split(/[.!?\n]/)[0].slice(0,50)||'Новый товар',raw:text,price:price});d.remove();state.tab='queue';render()}}
render();
</script></body></html>
