<style>

t(7,1fr);gap:4px}.weekdays div{text-align:center;padding:5px 1px;font-size:10px;font-weight:800;color:#93988f}.day{position:relative;min-height:56px;padding:7px;border:1px solid #eef0ea;border-radius:9px;background:white;text-align:left;font-size:12px;font-weight:700}.day:hover:not(:disabled){border-color:#9dad94}.day:disabled{background:#fafaf8;color:#c8cbc5}.day.today{border-color:#94a86c;background:#f7fbec}.day.selected{background:var(--lime);border-color:var(--lime)}.event-dot{position:absolute;bottom:7px;left:7px;width:5px;height:5px;border-radius:50%;background:#4b7cf1}.slot-label{font-size:10px;color:#4a70c5;margin-top:7px}.day-card h2{font-size:17px;margin:0}.date-caption{font-size:12px;color:var(--dim);margin:4px 0 15px}.slots{display:grid;gap:8px}.slot{padding:12px;border-radius:10px;background:#f3f5ef;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:750}.slot small{font-size:10px;color:#529a68}.slot-add{margin-top:12px;width:100%;padding:12px;border:1px dashed #aeb7a5;border-radius:10px;color:#52614b;font-size:12px;font-weight:800}.notice{font-size:12px;color:#8a691c;background:#fff7df;border-radius:10px;padding:12px;line-height:1.45}.overlay{position:fixed;z-index:30;inset:0;background:#20252075;display:grid;align-items:end}.sheet{background:var(--bg);width:100%;max-height:94dvh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 16px max(24px,env(safe-area-inset-bottom));animation:rise .2s ease-out}.modal{background:var(--paper);border-radius:18px;padding:22px;max-width:580px;width:100%;margin:auto;position:relative}.handle{width:35px;height:4px;border-radius:5px;background:#d3d6cf;margin:0 auto 17px}.close{position:absolute;right:13px;top:11px;color:#858a82;font-size:26px}.modal h1{margin:5px 32px 18px 0;font-size:23px;letter-spacing:-.5px}.field{display:grid;gap:7px;font-size:12px;font-weight:800;color:#555b53;margin:14px 0}.field input,.field textarea{width:100%;padding:12px;border:1px solid #dfe2da;border-radius:10px;background:white;resize:vertical;color:var(--ink)}.upload{min-height:106px;border:1px dashed #aeb7a5;border-radius:12px;display:grid;place-items:center;text-align:center;position:relative;color:#506348;font-size:13px;font-weight:800}.upload input{position:absolute;inset:0;opacity:0}.upload small{display:block;color:#92978f;font-size:11px;font-weight:500;margin-top:5px}.button-row{display:flex;gap:8px;margin-top:20px}.button-row button{flex:1;padding:12px;border-radius:10px;font-size:13px;font-weight:800;background:#e9ece5}.button-row .confirm{background:var(--ink);color:white}.detail{position:fixed;z-index:25;inset:0;background:var(--bg);overflow:auto}.detail-header{height:61px;display:flex;align-items:center;gap:10px;padding:0 max(16px,calc((100vw - 760px)/2));border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}.back{width:34px;height:34px;border-radius:10px;background:var(--paper);border:1px solid var(--line);font-size:21px}.detail-header b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.detail-body{max-width:760px;margin:auto;padding:18px 14px 40px}.hero{height:245px;border-radius:16px;background:linear-gradient(145deg,#59635e,#272d2a);position:relative;overflow:hidden}.hero.gym{background:linear-gradient(145deg,#242825,#929b93)}.hero.run{background:linear-gradient(145deg,#58635e,#1e2421)}.hero:after{content:"";position:absolute;width:130px;height:16px;border-radius:10px;background:#ffffff45;transform:rotate(-28deg);left:calc(50% - 65px);top:calc(50% - 8px)}.photo-pager{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#1a1e1ba8;color:#fff;border-radius:13px;padding:5px 8px;font-size:11px}.detail-section{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:13px}.detail-section h1{font-size:22px;letter-spacing:-.5px;margin:0 0 9px}.detail-section h2{font-size:14px;margin:0 0 12px}.detail-section p{font-size:13px;color:var(--dim);line-height:1.58;margin:0}.detail-price{font-size:23px;font-weight:850;margin:12px 0}.price-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.price-choice{padding:10px 8px;border:1px solid var(--line);border-radius:10px;display:grid;gap:4px}.price-choice.active{background:#f3f8e2;border-color:#b9d778}.price-choice small{font-size:10px;color:var(--dim)}.price-choice b{font-size:13px}.detail-tabs{display:flex;border-bottom:1px solid var(--line);gap:8px}.detail-tabs button{padding:10px 12px;font-size:13px;font-weight:800;color:var(--dim)}.detail-tabs button.active{border-bottom:2px solid var(--ink);color:var(--ink)}.trade{display:flex;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid var(--line);font-size:13px}.trade:last-child{border-bottom:0}.trade small{display:block;color:var(--dim);font-size:11px;margin-top:5px}.check{height:34px;padding:0 11px;border-radius:9px;background:#e9f8ec;color:#25834a;font-size:12px;font-weight:800}.lock{min-height:100dvh;display:grid;place-items:center;padding:20px;background:var(--bg)}.lock-card{width:min(100%,370px);background:white;border:1px solid var(--line);border-radius:20px;padding:34px;display:grid;gap:14px;text-align:center;box-shadow:0 15px 45px #28302510}.lock-card .avito{justify-content:center}.lock-card h1{font-size:22px;margin:0}.lock-card p{font-size:13px;color:var(--dim);margin:0}.lock-card input{padding:12px;border:1px solid #dfe2da;border-radius:10px}.error{font-size:12px;color:#bd4441}@keyframes rise{from{transform:translateY(25px)}to{transform:translateY(0)}}@media(min-width:700px){.overlay{place-items:center;padding:22px}.sheet{max-width:590px;border-radius:20px;padding:22px}.sheet .handle{display:none}.calendar-page{grid-template-columns:1fr 280px}.day-card{align-self:start}.detail{position:fixed}.hero{height:320px}}@media(max-width:380px){.tabs button{padding-left:10px;padding-right:10px}.listing-row{grid-template-columns:52px minmax(0,1fr) auto;gap:9px}.thumb{width:52px;height:52px}.listing-price{font-size:13px}}

<body><div id="app"></div>
<script>
const app=document.getElementById('app');
const currency=n=>new Intl.NumberFormat('ru-RU').format(n)+' ₽';
const today=new Date();today.setHours(0,0,0,0);
const initialMonth=new Date(today.getFullYear(),today.getMonth(),1);
const state={locked:true,tab:'queue',month:initialMonth,selected:new Date(today),detail:null,detailTab:'info',nextId:10,items:[
{id:2,status:'ready',title:'Силовой тренажёр',price:20000,fast:18000,optimal:20000,slow:23000,raw:'Домашний силовой тренажёр. Комплектация и состояние описаны в заметках.',description:'Силовой тренажёр для домашнего использования. Перед публикацией проверьте комплектацию, габариты и условия самовывоза.',duration:'30–40 мин',photos:4},
{id:3,status:'published',title:'Беговая дорожка',price:28500,raw:'Складная беговая дорожка, рабочая, есть транспортировочные ролики.',description:'Складная беговая дорожка в рабочем состоянии. Самовывоз по открытому времени.',duration:'20–30 мин',photos:5,views:94,favorites:11,contacts:4,offers:[{name:'Иван',price:26000,discount:'−9%',date:'Сегодня, 11:24'}]}
],slots:{}};
function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
state.slots[dateKey(today)]=['14:00 — 18:00'];
function esc(v){return String(v||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function tabCount(s){return state.items.filter(x=>x.status===s).length}
function render(){
 if(state.locked){renderLock();return}
 app.innerHTML='<header class="appbar"><div class="avito">Avito<i></i></div><button class="calendar-button" id="cal-btn"><b>▦</b> Календарь</button></header><nav class="tabs">'+[['queue','Объявления'],['ready','Готовые'],['published','Опубликованные']].map(x=>'<button data-tab="'+x[0]+'" class="'+(state.tab===x[0]?'active':'')+'">'+x[1]+'<em>'+tabCount(x[0])+'</em></button>').join('')+'</nav><main class="shell">'+(state.tab==='calendar'?calendarHtml():listHtml())+'</main>'+(state.tab==='queue'?'<button class="add" id="add"><span>＋</span>Добавить объявление</button>':'');
 bind();
 if(state.detail)renderDetail();
}
function listHtml(){let items=state.items.filter(x=>x.status===state.tab);if(!items.length)return '<section class="list empty"><div class="empty-mark">⌁</div><h2>'+({queue:'Нет новых объявлений',ready:'Нет готовых объявлений',published:'Нет опубликованных объявлений'})[state.tab]+'</h2><p>'+(state.tab==='queue'?'Добавьте фотографии и заметки. Объявление появится здесь до обработки.':'Объявления появятся здесь, когда перейдут на следующий этап.')+'</p></section>';return '<section class="list">'+items.map(rowHtml).join('')+'</section>'}
function rowHtml(x){let meta=x.status==='queue'?'Ожидает обработки':x.status==='ready'?'Готово к публикации':('👁 '+x.views+' · ♥ '+x.favorites+' · 💬 '+x.contacts);let cls=x.status==='ready'?'gym':x.status==='published'?'run':'';return '<button class="listing-row" data-detail="'+x.id+'"><div class="thumb '+cls+'"></div><div><div class="listing-title">'+esc(x.title)+'</div><div class="listing-meta">'+meta+'</div></div><div class="listing-price">'+(x.price?currency(x.price):'')+(x.status==='published'?'<small>Активно</small>':'')+'<span class="row-arrow">›</span></div></button>'}
function calendarHtml(){let month=state.month,year=month.getFullYear(),num=month.getMonth(),first=(new Date(year,num,1).getDay()+6)%7,last=new Date(year,num+1,0).getDate(),prev=new Date(year,num,0).getDate(),cells='';for(let i=0;i<42;i++){let day=i-first+1,cellDate=new Date(year,num,day),outside=day<1||day>last,disabled=cellDate<today,selected=dateKey(cellDate)===dateKey(state.selected),slots=state.slots[dateKey(cellDate)]||[];cells+='<button class="day '+(outside?'outside ':'')+(dateKey(cellDate)===dateKey(today)?'today ':'')+(selected?'selected ':'')+'" '+(disabled?'disabled':'data-date="'+dateKey(cellDate)+'"')+'><span>'+((day<1)?prev+day:day>last?day-last:day)+'</span>'+(!outside&&slots.length?'<i class="event-dot"></i><b class="slot-label">'+slots.length+' слот</b>':'')+'</button>'}let slots=state.slots[dateKey(state.selected)]||[],caption=state.selected.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});return '<section class="calendar-page"><div class="cal-card"><div class="cal-head"><h1>'+month.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})+'</h1><div class="month-control"><button id="prev">‹</button><button id="next">›</button></div></div><div class="weekdays">'+['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>'<div>'+x+'</div>').join('')+'</div><div class="days">'+cells+'</div></div><aside class="day-card"><h2>'+caption+'</h2><div class="date-caption">Время для самовывоза</div><div class="slots">'+(slots.length?slots.map(x=>'<div class="slot"><b>'+x+'</b><small>Открыт</small></div>').join(''):'<p class="date-caption">Время пока не открыто.</p>')+'</div><button class="slot-add" id="open-slot">＋ Добавить время</button><p class="notice">Прошедшие даты закрыты. Слоты станут основой для будущего расписания встреч.</p></aside></section>'}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});document.getElementById('cal-btn').onclick=()=>{state.tab='calendar';render()};if(document.getElementById('add'))document.getElementById('add').onclick=addSheet;if(document.getElementById('prev'))document.getElementById('prev').onclick=()=>{state.month=new Date(state.month.getFullYear(),state.month.getMonth()-1,1);render()};if(document.getElementById('next'))document.getElementById('next').onclick=()=>{state.month=new Date(state.month.getFullYear(),state.month.getMonth()+1,1);render()};document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{state.selected=new Date(b.dataset.date+'T12:00:00');render()});if(document.getElementById('open-slot'))document.getElementById('open-slot').onclick=slotSheet()}
function layer(html){let el=document.createElement('div');el.className='overlay';el.innerHTML=html;document.body.append(el);el.addEventListener('click',e=>{if(e.target===el)el.remove()});el.querySelectorAll('.close,.cancel').forEach(b=>b.onclick=()=>el.remove());return el}
function addSheet(){let el=layer('<section class="sheet"><div class="handle"></div><form class="modal" id="new-ad"><button type="button" class="close">×</button><div class="overline">НОВОЕ ОБЪЯВЛЕНИЕ</div><h1>Добавить объявление</h1><label class="upload">＋ Загрузить от 1 до 10 фотографий<input type="file" accept="image/*" multiple><small>Фотографии сохранятся без изменений</small></label><label class="field">Заметки о товаре<textarea name="raw" rows="5" required placeholder="Размеры, дефекты, материал, комплект, особенности, история…"></textarea></label><label class="field">Желаемая цена, ₽<input name="price" type="number" min="0" placeholder="Необязательно"></label><div class="button-row"><button type="button" class="cancel">Отмена</button><button class="confirm">Сохранить в объявления</button></div></form></section>');el.querySelector('#new-ad').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),raw=f.get('raw');state.items.unshift({id:state.nextId++,status:'queue',title:raw.split(/[.!?\n]/)[0].slice(0,50)||'Новое объявление',raw:raw,price:Number(f.get('price'))||null,photos:0});el.remove();render()}}
function slotSheet(){return ()=>{let el=layer('<section class="sheet"><div class="handle"></div><form class="modal" id="slot-form"><button type="button" class="close">×</button><div class="overline">САМОВЫВОЗ</div><h1>Открыть время</h1><label class="field">С<input type="time" name="from" value="14:00" required></label><label class="field">До<input type="time" name="to" value="18:00" required></label><div class="button-row"><button type="button" class="cancel">Отмена</button><button class="confirm">Сохранить</button></div></form></section>');el.querySelector('#slot-form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),key=dateKey(state.selected);if(!state.slots[key])state.slots[key]=[];state.slots[key].push(f.get('from')+' — '+f.get('to'));el.remove();render()}}}
function renderDetail(){let x=state.detail,kind=x.status==='ready'?'gym':x.status==='published'?'run':'',content='';if(x.status==='queue'){content='<section class="detail-section"><h1>'+esc(x.title)+'</h1><p>'+esc(x.raw)+'</p></section><section class="detail-section"><h2>Желаемая цена</h2><div class="detail-price">'+(x.price?currency(x.price):'Не указана')+'</div><div class="button-row"><button class="cancel">Редактировать вручную</button><button class="confirm">Добавить комментарий для обработки</button></div></section>'}else if(x.status==='ready'){content='<section class="detail-section"><h1>'+esc(x.title)+'</h1><p>Время самовывоза: '+x.duration+'</p><div class="detail-price">'+currency(x.price)+'</div><div class="price-grid">'+[['Быстрая',x.fast],['Оптимальная',x.optimal],['Долгая',x.slow]].map(p=>'<button class="price-choice '+(x.price===p[1]?'active':'')+'" data-detail-price="'+p[1]+'"><small>'+p[0]+'</small><b>'+currency(p[1])+'</b></button>').join('')+'</div></section><section class="detail-section"><h2>Описание</h2><p>'+esc(x.description)+'</p><div class="button-row"><button class="cancel">Редактировать</button><button class="confirm" id="publish">Опубликовать</button></div></section>'}else{let info='<section class="detail-section"><h1>'+esc(x.title)+'</h1><div class="detail-price">'+currency(x.price)+'</div><p>'+esc(x.description)+'</p><div class="button-row"><button class="cancel">Редактировать вручную</button></div></section>',trades='<section class="detail-section">'+(x.offers.length?x.offers.map(o=>'<div class="trade"><div><b>'+o.name+' · '+currency(o.price)+'</b><small>'+o.discount+' от цены · '+o.date+'</small></div><button class="check">✓ Принять</button></div>').join(''):'<p>Подходящих предложений пока нет.</p>')+'</section>';content='<section class="detail-section"><div class="detail-tabs"><button data-dtab="info" class="'+(state.detailTab==='info'?'active':'')+'">Информация</button><button data-dtab="trades" class="'+(state.detailTab==='trades'?'active':'')+'">Торги</button></div></section>'+(state.detailTab==='info'?info:trades)}let el=document.createElement('section');el.className='detail';el.id='detail';el.innerHTML='<header class="detail-header"><button class="back">‹</button><b>'+esc(x.title)+'</b></header><main class="detail-body"><div class="hero '+kind+'"><span class="photo-pager">1 / '+(x.photos||1)+'</span></div>'+content+'</main>';document.body.append(el);el.querySelector('.back').onclick=()=>{state.detail=null;state.detailTab='info';el.remove()};el.querySelectorAll('[data-detail-price]').forEach(b=>b.onclick=()=>{x.price=Number(b.dataset.detailPrice);el.remove();renderDetail()});el.querySelectorAll('[data-dtab]').forEach(b=>b.onclick=()=>{state.detailTab=b.dataset.dtab;el.remove();renderDetail()});if(el.querySelector('#publish'))el.querySelector('#publish').onclick=()=>{x.status='published';x.views=0;x.favorites=0;x.contacts=0;x.offers=[];state.detail=null;state.detailTab='info';el.remove();state.tab='published';render()}}
function renderLock(){app.innerHTML='<main class="lock"><form class="lock-card" id="login"><div class="avito">Avito<i></i></div><h1>Кабинет продавца</h1><p>Введите пароль, чтобы открыть объявления.</p><input name="password" type="password" placeholder="Пароль" autofocus><button class="confirm">Войти</button></form></main>';document.getElementById('login').onsubmit=e=>{e.preventDefault();if(new FormData(e.target).get('password')==='132213'){state.locked=false;render()}else{let er=document.createElement('span');er.className='error';er.textContent='Неверный пароль';e.target.append(er)}}}
render();
</script>
</body>
</html>
