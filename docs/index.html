<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121721">
<title>Авитолог</title>
<style>
:root{--ink:#18202d;--muted:#768094;--line:#e5e9f0;--bg:#f4f6fa;--paper:#fff;--violet:#635bda;--blue:#1d77e8;--green:#21966c;--orange:#d9822b;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer;border:0;background:none;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #91c4ff;outline-offset:2px}.app-header{background:#121721;color:#f8f9fc;position:sticky;top:0;z-index:8}.topbar{height:64px;max-width:1180px;margin:auto;padding:0 28px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:750}.brand-mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#7f6bf1,#30a8f7);display:grid;place-items:center;font-weight:850;color:white}.mode{font-size:12px;color:#a8b4c7;display:flex;gap:7px;align-items:center}.mode:before{content:"";width:7px;height:7px;border-radius:50%;background:#64dca5;box-shadow:0 0 0 3px #64dca526}.tabs{max-width:1180px;margin:auto;padding:0 20px;display:flex;gap:4px;overflow:auto}.tabs button{position:relative;white-space:nowrap;padding:15px 16px;color:#9eaabc;font-size:13px;font-weight:600}.tabs button.active{color:#fff}.tabs button.active:after{content:"";position:absolute;height:3px;left:15px;right:15px;bottom:0;border-radius:4px;background:#7ea6ff}.tabs em{font-style:normal;font-size:10px;padding:2px 6px;background:#30394a;color:#dce3f1;border-radius:12px;margin-left:6px}.shell{max-width:1120px;margin:0 auto;padding:36px 28px 110px}.page-heading{display:flex;align-items:end;justify-content:space-between;margin-bottom:23px}.overline{font-size:10px;letter-spacing:1.5px;font-weight:750;color:#8791a3}.page-heading h1{font-size:30px;letter-spacing:-1px;margin:6px 0 0}.status-chip{font-size:12px;color:#5e6a7c;background:#e9edf5;padding:8px 10px;border-radius:20px}.stack{display:grid;gap:14px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 4px 20px #25314d08}.queue-card{padding:22px;display:flex;gap:20px;align-items:center}.draft-icon{width:52px;height:52px;flex:0 0 auto;border-radius:15px;background:#fff4e7;color:#d9822b;display:grid;place-items:center;font-size:24px}.card-main{min-width:0;flex:1}.meta-line{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted)}.pill{font-size:11px;padding:5px 8px;border-radius:12px;background:#edf0ff;color:#5b54ca;font-weight:700}.pill.wait{background:#fff3e3;color:#bb7228}.title{font-size:17px;font-weight:730;margin:7px 0 4px}.note{font-size:13px;color:var(--muted);line-height:1.45}.ghost{background:#f1f3f7;padding:10px 12px;border-radius:10px;color:#596476;font-size:12px;font-weight:650}.empty{padding:74px 20px;text-align:center}.empty-icon{margin:auto auto 15px;width:50px;height:50px;border-radius:16px;background:#e9edff;color:#675fe0;display:grid;place-items:center;font-size:24px}.empty h3{margin:0 0 7px;font-size:17px}.empty p{margin:0;color:var(--muted);font-size:13px}.fab{position:fixed;z-index:5;right:max(28px,calc((100vw - 1120px)/2));bottom:28px;background:var(--blue);color:white;padding:14px 19px;border-radius:12px;box-shadow:0 12px 25px #1d77e84a;font-size:13px;font-weight:750}.fab span{font-size:21px;vertical-align:-2px;margin-right:7px}.listing{display:grid;grid-template-columns:260px 1fr;overflow:hidden}.media{min-height:235px;background:linear-gradient(145deg,#242c39,#596477);display:flex;align-items:flex-end;padding:16px;color:white}.media:before{content:"Фото товара";display:block;border:1px solid #ffffff5b;border-radius:8px;padding:7px 9px;font-size:11px;background:#10141c6e}.listing-body{padding:23px}.listing-top{display:flex;justify-content:space-between;gap:15px}.listing h2{font-size:21px;margin:7px 0}.price-market{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:17px 0}.price-option{border:1px solid var(--line);border-radius:12px;padding:11px;display:grid;gap:4px;cursor:pointer}.price-option.selected{border-color:#8aaef4;background:#f2f7ff}.price-option input{display:none}.price-option small{font-size:11px;color:var(--muted)}.price-option strong{font-size:15px}.description-toggle{width:100%;border-top:1px solid var(--line);padding:14px 0 0;margin-top:5px;text-align:left;font-size:13px;font-weight:650;color:#506073}.description{font-size:13px;line-height:1.6;color:#667185;padding-top:8px;max-width:700px}.actions{display:flex;gap:9px;margin-top:17px}.btn{padding:11px 13px;border-radius:10px;font-size:12px;font-weight:700;background:#eff1f5;color:#475366}.btn.primary{background:var(--blue);color:white}.published-list{display:grid;gap:8px}.published-row{width:100%;text-align:left;display:grid;grid-template-columns:58px 1fr auto;align-items:center;gap:14px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--paper)}.thumb{height:58px;border-radius:10px;background:linear-gradient(145deg,#606e81,#2d3746)}.published-row b{font-size:14px}.published-row span{display:block;font-size:12px;color:var(--muted);margin-top:4px}.price-right{text-align:right}.price-right strong{display:block;font-size:14px}.price-right small{font-size:11px;color:var(--green)}.calendar-layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:14px}.calendar-card{padding:21px}.calendar-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.calendar-top h2{font-size:18px;margin:0}.month-nav{display:flex;gap:6px}.month-nav button{width:31px;height:31px;border-radius:8px;background:#f0f2f6;color:#566174;font-size:19px}.weekday-grid,.days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.weekday-grid div{padding:6px 3px;text-align:center;font-size:10px;font-weight:750;color:#9099a9}.day{min-height:78px;border:1px solid #edf0f4;border-radius:10px;padding:8px;text-align:left;background:white;vertical-align:top}.day:hover{border-color:#b4c6e8}.day.muted-day{color:#c0c6d1;background:#fafbfc}.day.today{border-color:#7da7ff;box-shadow:0 0 0 2px #e7f0ff}.day.selected{background:#eef5ff;border-color:#77a3f4}.day-num{font-size:12px;font-weight:700}.dot{width:6px;height:6px;border-radius:10px;background:#51be87;margin-top:7px}.slot-count{display:block;font-size:10px;color:#467ad3;margin-top:6px}.side-card{padding:21px}.side-card h2{font-size:17px;margin:0 0 5px}.picked-date{font-size:12px;color:var(--muted);margin-bottom:17px}.slot-item{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:12px 0;font-size:13px}.slot-item span{color:var(--green);font-size:11px}.add-slot{width:100%;margin-top:10px;border:1px dashed #9eafd0;border-radius:10px;padding:11px;color:#5272ad;font-size:12px;font-weight:700}.delivery{margin-top:18px;padding:12px;border-radius:11px;background:#fff6ea;font-size:12px;color:#9a651e;line-height:1.45}.overlay{position:fixed;z-index:20;inset:0;background:#11182682;display:grid;place-items:center;padding:18px}.modal{width:min(100%,570px);background:white;border-radius:20px;padding:25px;box-shadow:0 26px 75px #0e152852;position:relative}.close{position:absolute;right:14px;top:10px;color:#7d8797;font-size:26px}.modal h2{font-size:22px;margin:6px 0 18px}.field{display:grid;gap:7px;font-size:12px;font-weight:700;color:#596474;margin-bottom:14px}.field input,.field textarea{border:1px solid #dfe3ea;border-radius:10px;padding:11px 12px;background:#fff;resize:vertical}.upload-zone{border:1px dashed #a9b8d2;border-radius:12px;min-height:105px;display:grid;place-items:center;position:relative;color:#4f71ae;font-size:13px;font-weight:700;margin-bottom:14px}.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer}.upload-zone small{display:block;color:#8993a3;font-weight:500;margin-top:5px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.detail-modal{width:min(100%,750px);max-height:88vh;overflow:auto}.detail-head{display:flex;gap:16px;padding-right:30px}.detail-picture{width:116px;height:116px;flex:0 0 auto;border-radius:13px;background:linear-gradient(145deg,#536071,#202735)}.detail-tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:22px 0 16px}.detail-tabs button{padding:10px 12px;font-size:13px;font-weight:700;color:#7a8494}.detail-tabs button.active{border-bottom:2px solid var(--blue);color:var(--blue)}.trade{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:12px 0;font-size:13px}.trade small{display:block;color:var(--muted);margin-top:4px}.accept{background:#e8f8f0;color:#23865e;border-radius:9px;padding:9px 11px;font-size:12px;font-weight:700}.lock{min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 25%,#edf2ff,#f5f7fa 65%)}.lock-card{width:min(100%,380px);display:grid;gap:14px;text-align:center;background:white;padding:36px;border:1px solid var(--line);border-radius:23px;box-shadow:0 20px 60px #18233412}.lock-card .brand-mark{width:45px;height:45px;margin:auto;font-size:22px}.lock-card h1{font-size:26px;margin:0}.lock-card p{color:var(--muted);font-size:13px;margin:0}.lock-card input{border:1px solid #dfe3ea;border-radius:10px;padding:12px}.error{font-size:12px;color:#bd414a}@media(max-width:720px){.topbar{padding:0 16px}.mode{font-size:11px}.tabs{padding:0 7px}.tabs button{padding:13px 10px;font-size:12px}.shell{padding:25px 14px 105px}.page-heading h1{font-size:26px}.listing{grid-template-columns:1fr}.media{min-height:170px}.price-market{gap:5px}.price-option{padding:8px}.price-option strong{font-size:12px}.calendar-layout{grid-template-columns:1fr}.day{min-height:57px;padding:6px}.slot-count{display:none}.weekday-grid,.days-grid{gap:3px}.published-row{grid-template-columns:50px 1fr auto}.thumb{height:50px}.queue-card{padding:16px;gap:13px}.fab{right:16px;bottom:18px}.detail-head{display:block}.detail-picture{margin-bottom:13px}.actions .btn{flex:1}}
</style>
</head>
<body><div id="app"></div>
<script>
const app=document.getElementById('app');
const fmt=n=>new Intl.NumberFormat('ru-RU').format(n)+' ₽';
const state={locked:true,tab:'queue',selectedDate:4,description:false,detail:null,detailTab:'info',nextId:10,items:[
{id:1,status:'queue',title:'Колёса R16',raw:'Комплект колёс, состояние хорошее. Небольшие следы эксплуатации, 4 штуки.',desired:12000},
{id:2,status:'ready',title:'Винтажный торшер',raw:'Металл, рабочий, патина на основании.',description:'Винтажный торшер с выразительной патиной. Рабочий, подойдёт для гостиной, кабинета или студии. Самовывоз доступен в открытые даты.',fast:5100,optimal:6000,slow:6900,price:6000},
{id:3,status:'published',title:'Набор инструментов СССР',raw:'Полный комплект в металлическом кейсе.',description:'Аккуратный набор инструментов в металлическом кейсе.',price:3800,views:47,favorites:6,contacts:2,offers:[{name:'Иван',price:3500,discount:'−8%',date:'сегодня'}]},
{id:4,status:'published',title:'Стеллаж металлический',raw:'Разборный стеллаж.',description:'Прочный стеллаж для гаража или мастерской.',price:5200,views:31,favorites:3,contacts:1,offers:[]}
],slots:{4:['14:00 — 18:00'],10:['10:00 — 13:00'],18:['12:00 — 16:00']}};
function esc(value){return String(value||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function count(status){return state.items.filter(x=>x.status===status).length}
function render(){
 if(state.locked){renderLock();return}
 app.innerHTML=headerHtml()+'<main class="shell">'+pageHtml()+'</main>'+((state.tab==='queue')?'<button class="fab" id="add"><span>＋</span>Добавить объявление</button>':'');
 bindApp();
 if(state.detail)renderDetail();
}
function headerHtml(){const tabs=[['queue','Объявления'],['ready','Готовые'],['published','Опубликованные'],['calendar','Календарь']];return '<header class="app-header"><div class="topbar"><div class="brand"><span class="brand-mark">А</span>Авитолог</div><div class="mode">Автономный режим</div></div><nav class="tabs">'+tabs.map(x=>'<button data-tab="'+x[0]+'" class="'+(state.tab===x[0]?'active':'')+'">'+x[1]+(x[0]!=='calendar'?'<em>'+count(x[0])+'</em>':'')+'</button>').join('')+'</nav></header>'}
function pageHtml(){if(state.tab==='calendar')return calendarHtml();const name={queue:'Объявления',ready:'Готовые',published:'Опубликованные'}[state.tab];return '<div class="page-heading"><div><div class="overline">ПАНЕЛЬ ПРОДАВЦА</div><h1>'+name+'</h1></div><span class="status-chip">Только на этом устройстве</span></div>'+listHtml()}
function listHtml(){const list=state.items.filter(x=>x.status===state.tab);if(!list.length)return '<section class="card empty"><div class="empty-icon">✦</div><h3>Здесь пока пусто</h3><p>Добавьте объявление, чтобы начать работу.</p></section>';if(state.tab==='published')return '<section class="published-list">'+list.map(publishedRow).join('')+'</section>';return '<section class="stack">'+list.map(x=>state.tab==='queue'?queueCard(x):readyCard(x)).join('')+'</section>'}
function queueCard(x){return '<article class="card queue-card"><div class="draft-icon">⌁</div><div class="card-main"><div class="meta-line"><span class="pill wait">Ожидает обработки</span><span>добавлено только что</span></div><div class="title">'+esc(x.title)+'</div><div class="note">'+esc(x.raw)+'</div></div><button class="ghost">Черновик</button></article>'}
function readyCard(x){return '<article class="card listing"><div class="media"></div><div class="listing-body"><div class="listing-top"><div><div class="overline">ГОТОВО К ПРОВЕРКЕ</div><h2>'+esc(x.title)+'</h2></div><span class="pill">Не опубликовано</span></div><p class="note">'+esc(x.raw)+'</p><div class="price-market">'+[['Быстрая',x.fast],['Оптимальная',x.optimal],['Долгая',x.slow]].map(p=>'<label class="price-option '+(x.price===p[1]?'selected':'')+'"><input data-price="'+x.id+'|'+p[1]+'" type="radio" name="p'+x.id+'" '+(x.price===p[1]?'checked':'')+'><small>'+p[0]+'</small><strong>'+fmt(p[1])+'</strong></label>').join('')+'</div><button class="description-toggle" data-description="'+x.id+'">'+(state.description?'Скрыть описание':'Показать описание')+' <span>⌄</span></button>'+(state.description?'<div class="description">'+esc(x.description)+'</div>':'')+'<div class="actions"><button class="btn" data-edit="'+x.id+'">Редактировать</button><button class="btn primary" data-publish="'+x.id+'">Опубликовать</button></div></div></article>'}
function publishedRow(x){return '<button class="published-row" data-detail="'+x.id+'"><div class="thumb"></div><div><b>'+esc(x.title)+'</b><span>👁 '+x.views+' · ♥ '+x.favorites+' · 💬 '+x.contacts+'</span></div><div class="price-right"><strong>'+fmt(x.price)+'</strong><small>Активно</small></div></button>'}
function calendarHtml(){const month='Октябрь 2026';let days=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d=>'<div>'+d+'</div>').join('');let cells='';for(let i=0;i<35;i++){let day=i-2;let muted=day<1||day>31;let slots=state.slots[day]||[];cells+='<button class="day '+(muted?'muted-day ':'')+(day===4?'today ':'')+(day===state.selectedDate?'selected':'')+'" '+(muted?'disabled':'data-day="'+day+'"')+'><span class="day-num">'+(muted?(day<1?30:day-31):day)+'</span>'+(!muted&&slots.length?'<span class="dot"></span><span class="slot-count">'+slots.length+' слот</span>':'')+'</button>'}let selected=state.slots[state.selectedDate]||[];return '<div class="page-heading"><div><div class="overline">САМОВЫВОЗ И ЛОГИСТИКА</div><h1>Календарь</h1></div><span class="status-chip">Октябрь 2026</span></div><div class="calendar-layout"><section class="card calendar-card"><div class="calendar-top"><h2>'+month+'</h2><div class="month-nav"><button aria-label="Предыдущий месяц">‹</button><button aria-label="Следующий месяц">›</button></div></div><div class="weekday-grid">'+days+'</div><div class="days-grid">'+cells+'</div></section><aside class="card side-card"><h2>'+state.selectedDate+' октября</h2><div class="picked-date">Доступность для самовывоза</div>'+selected.map(s=>'<div class="slot-item"><b>'+s+'</b><span>Открыт</span></div>').join('')+(selected.length?'':'<p class="muted">На этот день пока нет открытого времени.</p>')+'<button class="add-slot" id="slot-add">＋ Открыть время</button><p class="delivery">Дни отправки Авито Доставкой можно отметить после подключения сервера.</p></aside></div>'}
function bindApp(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});document.querySelectorAll('[data-price]').forEach(b=>b.onchange=()=>{let p=b.dataset.price.split('|'),x=state.items.find(i=>i.id==p[0]);x.price=Number(p[1]);render()});document.querySelectorAll('[data-description]').forEach(b=>b.onclick=()=>{state.description=!state.description;render()});document.querySelectorAll('[data-publish]').forEach(b=>b.onclick=()=>{let x=state.items.find(i=>i.id==b.dataset.publish);x.status='published';x.views=0;x.favorites=0;x.contacts=0;x.offers=[];state.tab='published';render()});document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>{state.detail=state.items.find(i=>i.id==b.dataset.detail);renderDetail()});document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{state.selectedDate=Number(b.dataset.day);render()});if(document.getElementById('add'))document.getElementById('add').onclick=renderAdd;if(document.getElementById('slot-add'))document.getElementById('slot-add').onclick=renderSlot}
function renderLock(){app.innerHTML='<main class="lock"><form class="lock-card" id="login"><span class="brand-mark">А</span><h1>Авитолог</h1><p>Рабочее пространство продавца</p><input name="password" type="password" autocomplete="current-password" placeholder="Пароль" autofocus><button class="btn primary">Войти</button><span class="muted">Локальный визуальный режим</span></form></main>';document.getElementById('login').onsubmit=e=>{e.preventDefault();if(new FormData(e.target).get('password')==='132213'){state.locked=false;render()}else{let err=document.createElement('span');err.className='error';err.textContent='Неверный пароль';e.target.append(err)}}}
function renderAdd(){const layer=document.createElement('div');layer.className='overlay';layer.innerHTML='<form class="modal" id="add-form"><button type="button" class="close">×</button><div class="overline">НОВОЕ ОБЪЯВЛЕНИЕ</div><h2>Добавить товар</h2><label class="upload-zone">＋ Загрузить фотографии<input type="file" accept="image/*" multiple><small>В этом прототипе фото никуда не передаются</small></label><label class="field">Заметки о товаре<textarea required name="raw" rows="5" placeholder="Размеры, состояние, дефекты, комплект, история…"></textarea></label><label class="field">Желаемая цена, ₽<input name="price" type="number" min="0" placeholder="Необязательно"></label><div class="modal-actions"><button type="button" class="btn cancel">Отмена</button><button class="btn primary">Сохранить в очередь</button></div></form>';document.body.append(layer);layer.querySelector('.close').onclick=()=>layer.remove();layer.querySelector('.cancel').onclick=()=>layer.remove();layer.onclick=e=>{if(e.target===layer)layer.remove()};layer.querySelector('#add-form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),raw=f.get('raw');state.items.unshift({id:state.nextId++,status:'queue',title:raw.split(/[.!?\n]/)[0].slice(0,50)||'Новое объявление',raw:raw,desired:Number(f.get('price'))||null});layer.remove();render()}}
function renderSlot(){const layer=document.createElement('div');layer.className='overlay';layer.innerHTML='<form class="modal" id="slot-form"><button type="button" class="close">×</button><div class="overline">САМОВЫВОЗ</div><h2>Открыть время</h2><label class="field">С<input name="from" type="time" value="14:00" required></label><label class="field">До<input name="to" type="time" value="18:00" required></label><div class="modal-actions"><button type="button" class="btn cancel">Отмена</button><button class="btn primary">Сохранить слот</button></div></form>';document.body.append(layer);layer.querySelector('.close').onclick=()=>layer.remove();layer.querySelector('.cancel').onclick=()=>layer.remove();layer.querySelector('#slot-form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);if(!state.slots[state.selectedDate])state.slots[state.selectedDate]=[];state.slots[state.selectedDate].push(f.get('from')+' — '+f.get('to'));layer.remove();render()}}
function renderDetail(){const x=state.detail,layer=document.createElement('div');layer.className='overlay';layer.id='detail';let info='<div class="detail-head"><div class="detail-picture"></div><div><div class="overline">ОПУБЛИКОВАНО</div><h2>'+esc(x.title)+'</h2><strong>'+fmt(x.price)+'</strong><p class="note">'+esc(x.description)+'</p></div></div><div class="actions"><button class="btn">Изменить вручную</button><button class="btn">Улучшить с ИИ</button></div>';let trades=x.offers.length?x.offers.map(o=>'<div class="trade"><div><b>'+o.name+' предлагает '+fmt(o.price)+'</b><small>'+o.discount+' от вашей цены · '+o.date+'</small></div><button class="accept">✓ Принять</button></div>').join(''):'<p class="muted">Подходящих предложений пока нет.</p>';layer.innerHTML='<section class="modal detail-modal"><button class="close">×</button>'+info+'<nav class="detail-tabs"><button data-dtab="info" class="'+(state.detailTab==='info'?'active':'')+'">Информация</button><button data-dtab="trades" class="'+(state.detailTab==='trades'?'active':'')+'">Торги</button></nav><div>'+(state.detailTab==='info'?'<p class="description">'+esc(x.description)+'</p>':trades)+'</div></section>';document.body.append(layer);layer.querySelector('.close').onclick=()=>{state.detail=null;state.detailTab='info';layer.remove()};layer.onclick=e=>{if(e.target===layer){state.detail=null;layer.remove()}};layer.querySelectorAll('[data-dtab]').forEach(b=>b.onclick=()=>{state.detailTab=b.dataset.dtab;layer.remove();renderDetail()})}
render();
</script>
</body></html>
